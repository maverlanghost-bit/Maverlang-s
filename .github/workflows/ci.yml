# CI completo (M87, ola 21): jobs `checks`, `build` y `e2e`.
# Vercel despliega los previews por rama (M50): este CI no despliega.
# Sin secretos reales: sólo valores mock/dummy (DATA_MODE=mock y cía.).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI-01 / M-08: el GITHUB_TOKEN de este pipeline es de sólo lectura.
# `contents: read` a nivel de workflow; ningún job eleva el permiso porque
# ninguno lo necesita (upload-artifact usa ACTIONS_RUNTIME_TOKEN, no el
# GITHUB_TOKEN). Si un job futuro requiere escritura, se eleva ahí y sólo ahí.
permissions:
  contents: read

# Común a los tres jobs. `ALLOW_MOCK_AUTH` lo exige el endurecimiento de auth
# cuando NODE_ENV=production: el build y el e2e corren así en el runner y, sin
# el flag, el arranque falla aunque AUTH_MODE sea mock. Sólo afecta a los datos
# de prueba de este workflow, que no tiene secretos reales.
env:
  ALLOW_MOCK_AUTH: "true"

jobs:
  checks:
    name: checks (typecheck, lint, test, secretos, dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores mock/dummy no secretos, lo mínimo para que typecheck y
      # los tests corran como en local (igual que scripts/e2e.mjs).
      AUTH_MODE: mock
      NEXT_PUBLIC_AUTH_MODE: mock
      DATA_MODE: mock
      NEXT_PUBLIC_DATA_MODE: mock
      PRICES_MODE: mock
      RATE_LIMIT_BACKEND: memory
    steps:
      # Acciones fijadas a SHA completo (CI-01): un tag `v4` es mutable y su
      # dueño puede moverlo. El comentario es el tag resuelto con
      # `git ls-remote`; Dependabot (github-actions) mantiene los pines.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22 con caché de npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # npm exacto: el lockfile se genera con npm 11 y Node 22 trae npm 10.
      # Una versión flotante (`npm@11`) cambia el instalador sin revisión.
      - name: npm 11.19.0 (el lockfile se genera con npm 11)
        run: npm install -g npm@11.19.0

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Sólo árbol de trabajo (git ls-files): en un checkout limpio no hay
      # bundle todavía. El escaneo del bundle corre en el job `build`, después
      # del build y con --require-bundle (SEC-01).
      - name: Escáner de secretos (árbol de trabajo)
        run: npm run scan:secrets

      - name: Auditoría de dependencias
        run: npm run audit:deps

  # El build de producción es el gate más importante: si un merge lo rompe,
  # Vercel no despliega. Este job lo detecta antes de llegar a main.
  build:
    name: build (producción)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_MODE: mock
      NEXT_PUBLIC_AUTH_MODE: mock
      DATA_MODE: mock
      NEXT_PUBLIC_DATA_MODE: mock
      PRICES_MODE: mock
      RATE_LIMIT_BACKEND: memory
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22 con caché de npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11.19.0 (el lockfile se genera con npm 11)
        run: npm install -g npm@11.19.0

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      # SEC-01: el escaneo del bundle cliente sólo tiene sentido después del
      # build. `--require-bundle` hace fallar el paso si no hay `.next/static`
      # en vez de imprimir "se salta" y salir 0.
      - name: Escáner de secretos (bundle cliente, exige build)
        run: npm run scan:secrets -- --require-bundle

  # E2E con Playwright en Linux: `npm run e2e` (scripts/e2e.mjs) construye
  # con `next build` y sirve el build. Todo en mock: sin secretos reales.
  e2e:
    name: e2e (Playwright chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_MODE: mock
      NEXT_PUBLIC_AUTH_MODE: mock
      DATA_MODE: mock
      NEXT_PUBLIC_DATA_MODE: mock
      PRICES_MODE: mock
      RATE_LIMIT_BACKEND: memory
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22 con caché de npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11.19.0 (el lockfile se genera con npm 11)
        run: npm install -g npm@11.19.0

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (build + Playwright, todo en mock)
        run: npm run e2e

      - name: Subir reporte y trazas si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
